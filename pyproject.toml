[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.1.0"
description = "A single view of Ubuntu archive health"
requires-python = ">=3.13"

dependencies = [
    "python-debian>=1.1.1,<2",
    "requests>=2.34.2",
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "psycopg2-binary>=2.9.13",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
include = ["cairn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

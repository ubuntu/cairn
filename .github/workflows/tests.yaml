name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - cairn/**
      - tests/**
      - pyproject.toml
      - poetry.lock
      - ".github/workflows/tests.yaml"
  pull_request:
    branches: [main]
    paths:
      - cairn/**
      - tests/**
      - pyproject.toml
      - poetry.lock
      - ".github/workflows/tests.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.5.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Check lockfile
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --all-extras
      - name: Ruff check
        run: poetry run ruff check --output-format=github .
      - name: Ruff format check
        run: poetry run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Check lockfile
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --all-extras
      - name: Pytest
        run: poetry run pytest -q

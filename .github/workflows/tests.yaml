name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - cairn/**
      - tests/**
      - pyproject.toml
      - ".github/workflows/tests.yaml"
  pull_request:
    branches: [main]
    paths:
      - cairn/**
      - tests/**
      - pyproject.toml
      - ".github/workflows/tests.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.16.8"
      - name: Ruff check
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
